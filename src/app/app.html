<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h2>Customer Management</h2>
  
  <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; width: 300px;">
    <h3>{{ isEditing ? 'Edit Customer' : 'Add Customer' }}</h3>
    <input [(ngModel)]="currentCustomer.name" placeholder="Name" style="display:block; margin-bottom:10px;"><br>
    <input [(ngModel)]="currentCustomer.address_line_1" placeholder="Address 1" style="display:block; margin-bottom:10px;"><br>
    <input [(ngModel)]="currentCustomer.address_line_2" placeholder="Address 2" style="display:block; margin-bottom:10px;"><br>
    <input [(ngModel)]="currentCustomer.city" placeholder="City" style="display:block; margin-bottom:10px;"><br>
    <input [(ngModel)]="currentCustomer.state" placeholder="State" style="display:block; margin-bottom:10px;"><br>
    <input [(ngModel)]="currentCustomer.zip" placeholder="Zip" style="display:block; margin-bottom:10px;"><br>
    
    <button (click)="saveCustomer()">Save</button>
    <button (click)="resetForm()" *ngIf="isEditing">Cancel</button>
  </div>

  <table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%;">
    <tr>
      <th>ID</th><th>Name</th><th>Address</th><th>City</th><th>State</th><th>Zip</th><th>Actions</th>
    </tr>
    <tr *ngFor="let c of customers">
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.address_line_1 }} {{ c.address_line_2 }}</td>
      <td>{{ c.city }}</td>
      <td>{{ c.state }}</td>
      <td>{{ c.zip }}</td>
      <td>
        <button (click)="editCustomer(c)">Edit</button>
        <button (click)="deleteCustomer(c.id)">Delete</button>
      </td>
    </tr>
  </table>
</div>
